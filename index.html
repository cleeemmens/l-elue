<script>
/* ===================== CONFIG ===================== */
const SUPABASE_URL = "https://hjmreiccdcrrdnwmnnye.supabase.co";
const SUPABASE_KEY = "sb_publishable_MAqip45XAF55N-By7v8kqw_DdcsjBvj";
const ELECTION = "samedi 12 décembre";

/* ===================== DONNÉES ===================== */
const CANDS = [
 ["Alsace","Chiara Blazevic",24],["Aquitaine","Solène Videau",22],["Auvergne","Lina Berthelier",24],
 ["Bretagne","Margot Ferré-Bernard",20],["Bourgogne","Ilona Perrot",23],["Centre-Val de Loire","Justine Bourrelier",26],
 ["Champagne-Ardenne","Céline Leduc",23],["Corse","Satine Nomary",20],["Côte d'Azur","May Haoues",19],
 ["Franche-Comté","Emma Ninot",21],["Guyane","Sandra Justine",23],["Guadeloupe","Julia Désirée",20],
 ["Île-de-France","Camilla Alash",24],["Languedoc","Candice Gauch",29],["Limousin","Élise Escuriol",22],
 ["Lorraine","Léane Froment",21],["Martinique","Maureen-Alycia Lucea-Merlin",24],["Mayotte","Emma Saïd Issouf",24],
 ["Midi-Pyrénées","Carla Rachail",23],["Nouvelle-Calédonie","Lana Prost",18],["Nord-Pas-de-Calais","Shana Mendes",18],
 ["Normandie","Pauline Gourlez",22],["Pays de la Loire","Maëlle Hamon",23],["Picardie","Marie Villez",26],
 ["Poitou-Charentes","Mandy Goudal",38],["Provence","Ophélie Vitalbo",28],["Réunion","Laetitia Roguet",21],
 ["Rhône-Alpes","Julia Grid-Costantino",23],["Roussillon","Juliette Gauthier",23],["Saint-Barthélemy","Naïla Parotte",22],
 ["Tahiti","Leia Diard",22]
].map((c,i)=>({id:"c"+i,n:i+1,region:c[0],name:c[1],age:c[2]}));
const BY = Object.fromEntries(CANDS.map(c=>[c.id,c]));
const CRITS = [
 {id:"beaute",label:"Beauté & allure"},{id:"defiles",label:"Défilés"},{id:"discours",label:"Discours & présentation"},
 {id:"video",label:"Portrait vidéo"},{id:"costume",label:"Costume régional"},{id:"culture",label:"Test de culture générale"},
 {id:"vibe",label:"Charisme / « elle a un truc »"}];
const EMOJIS = ["👑","💄","✨","🌸","💅","🦋","🍾","💎","🌙","🎀","🔥","🍓","🐚","🌺","🦄","🍒"];
const ORDER_LABELS = ["Miss France 👑","1re dauphine","2e dauphine","3e dauphine","4e dauphine"];
const EMPTY_PRONO = ()=>({top15:[],top5:[],order:[null,null,null,null,null]});
const ERRORS = {NAME_TAKEN:"Ce prénom est déjà pris dans ce groupe : change ton prénom dans ton profil (ex : Léa B.) puis réessaie.",
  BAD_CODE:"Ce code n'existe pas. Vérifie-le !", VOTES_LOCKED:"Les votes sont fermés 🔒", NOT_ADMIN:"Mot de passe incorrect",
  NO_PROFILE:"Profil introuvable, recharge la page."};

/* ===================== ACCÈS À LA BASE ===================== */
function makeApi(){
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const ok = ({data,error})=>{ if(error) throw error; return data; };
  let uid=null;
  return {
    async session(){ const {data}=await sb.auth.getSession(); uid=data.session?.user?.id||null; return uid; },
    async signIn(){ const d=ok(await sb.auth.signInAnonymously()); uid=d.user.id; return uid; },
    async myProfile(){ return ok(await sb.from("profiles").select("*").eq("owner",uid).maybeSingle()); },
    async createProfile(name,emoji){ return ok(await sb.from("profiles").insert({name,emoji}).select().single()); },
    async saveProfile(id,patch){ return ok(await sb.from("profiles").update(patch).eq("id",id).select().single()); },
    async recoveryCode(){ return ok(await sb.rpc("my_recovery_code")); },
    async recover(code){ return ok(await sb.rpc("recover_profile",{p_code:code})); },
    async createLeague(name){ return ok(await sb.rpc("create_league",{p_name:name})); },
    async joinLeague(code){ return ok(await sb.rpc("join_league",{p_code:code})); },
    async leaveLeague(leagueId,profileId){ return ok(await sb.from("league_members").delete().eq("league_id",leagueId).eq("profile_id",profileId)); },
    async myLeagues(){ return ok(await sb.rpc("my_leagues"))||[]; },
    async leagueProfiles(id){ return ok(await sb.rpc("league_profiles",{p_league:id}))||[]; },
    async franceStats(){ return ok(await sb.rpc("france_stats")); },
    async results(){ return ok(await sb.from("results").select("*").eq("id",1).single()); },
    onResults(cb){ sb.channel("results").on("postgres_changes",{event:"*",schema:"public",table:"results"},p=>cb(p.new)).subscribe(); },
    async adminCheck(pwd){ return ok(await sb.rpc("admin_check",{p_pwd:pwd})); },
    async adminSetResults(pwd,r){ return ok(await sb.rpc("admin_set_results",{p_pwd:pwd,p_top15:r.top15,p_top5:r.top5,p_ord:r.ord})); },
    async adminSetLock(pwd,b){ return ok(await sb.rpc("admin_set_lock",{p_pwd:pwd,p_locked:b})); }
  };
}
const API = window.MOCK_API || makeApi();

/* ===================== ÉTAT ===================== */
let P=null;                       // mon profil
let R={top15:[],top5:[],ord:[null,null,null,null,null],votes_locked:false};
let F=null;                       // stats France
let LEAGUES=[];                   // mes groupes
const LP={};                      // profils par groupe
const UI={tab:"groupes",open:null,filter:"all",q:"",league:null,welcome:"new",emoji:"👑",admin:false,adminPwd:"",syncing:false};
let pendingJoin=null;
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const errMsg=e=>{const m=(e&&e.message)||String(e);for(const k in ERRORS) if(m.includes(k)) return ERRORS[k];return "Oups, problème de connexion. Réessaie !";};
function toast(t,err){const o=document.createElement("div");o.className="toast"+(err?" err":"");o.textContent=t;document.body.appendChild(o);setTimeout(()=>o.remove(),2600);}

/* ===================== CALCULS ===================== */
const critsOf=p=>p.mode==="global"?[{id:"global",label:"Note globale"}]:CRITS.filter(c=>(p.crits||[]).includes(c.id));
function avg(p,cid){const n=(p.notes||{})[cid];if(!n)return null;const v=critsOf(p).map(c=>n[c.id]).filter(x=>typeof x==="number");return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
const done=(p,cid)=>{const n=(p.notes||{})[cid]||{};const c=critsOf(p);return c.length>0&&c.every(k=>typeof n[k.id]==="number");};
const ranking=p=>CANDS.map(c=>({c,s:avg(p,c.id)})).filter(x=>x.s!==null).sort((a,b)=>b.s-a.s||a.c.n-b.c.n);
const franceTop=()=>(F?.ranking||[]).slice(0,5).map(x=>x.cand);
function groupTop(profiles){const pts={};profiles.forEach(p=>(p.top5||[]).forEach((id,i)=>{pts[id]=(pts[id]||0)+5-i;}));
  return Object.entries(pts).sort((a,b)=>b[1]-a[1]||BY[a[0]].n-BY[b[0]].n).map(([id,pts])=>({id,pts}));}
function score(p){
  const pr=p.prono||EMPTY_PRONO(), d={};
  d.t15=pr.top15.filter(id=>R.top15.includes(id)).length;
  d.t5=pr.top5.filter(id=>R.top5.includes(id)).length;
  d.win=(pr.order[0]&&pr.order[0]===R.ord[0])?1:0;
  d.exact=[1,2,3,4].filter(i=>pr.order[i]&&pr.order[i]===R.ord[i]).length;
  const tele=d.t15+d.t5*3+d.win*10+d.exact*2;
  const ft=franceTop(), mine=p.top5||[];
  d.common=mine.filter(id=>ft.includes(id)).length;
  d.same=mine.filter((id,i)=>ft[i]===id).length;
  d.coeur=(p.coeur&&p.coeur===ft[0])?1:0;
  const accord=ft.length?d.common*2+d.same+d.coeur*5:0;
  return {tele,accord,total:tele+accord,d};
}
const resultsStarted=()=>R.top15.length>0||R.top5.length>0||R.ord.some(Boolean);

/* ===================== SAUVEGARDE ===================== */
let pend={},timer=null;
function patch(obj){Object.assign(P,obj);Object.assign(pend,obj);UI.syncing=true;paintSync();clearTimeout(timer);timer=setTimeout(flush,700);}
function recomputeTop5(){patch({top5:ranking(P).slice(0,5).map(x=>x.c.id)});}
async function flush(){
  const body=pend;pend={};if(!Object.keys(body).length){UI.syncing=false;paintSync();return;}
  try{const fresh=await API.saveProfile(P.id,body);if(fresh&&!Object.keys(pend).length) P=fresh;}
  catch(e){toast(errMsg(e),true);try{P=await API.myProfile();}catch(_){} render();}
  UI.syncing=Object.keys(pend).length>0;paintSync();
}
function paintSync(){const s=document.getElementById("sync");if(s) s.textContent=UI.syncing?"…":"✓";}
window.addEventListener("beforeunload",()=>{if(Object.keys(pend).length) flush();});

/* ===================== CHARGEMENT ===================== */
async function refreshShared(){
  try{R=await API.results();}catch(e){}
  try{F=await API.franceStats();}catch(e){}
}
async function refreshLeagues(){
  try{LEAGUES=await API.myLeagues();}catch(e){LEAGUES=[];}
  if(UI.league&&!LEAGUES.find(l=>l.id===UI.league)) UI.league=null;
  if(!UI.league&&LEAGUES.length) UI.league=ls.get("cp-league")&&LEAGUES.find(l=>l.id===ls.get("cp-league"))?ls.get("cp-league"):LEAGUES[0].id;
  if(UI.league) await loadLeague(UI.league);
}
async function loadLeague(id){try{LP[id]=await API.leagueProfiles(id);}catch(e){}}
async function boot(){
  readHash();
  if(UI.admin){await refreshShared();render();return;}
  try{
    const uid=await API.session();
    if(uid) P=await API.myProfile();
  }catch(e){}
  await refreshShared();
  if(P){await refreshLeagues(); if(pendingJoin) await doJoin(pendingJoin);}
  render();
  try{API.onResults(r=>{R=r;render(true);});}catch(e){}
  setInterval(async()=>{ if(document.hidden) return; await refreshShared(); if(P&&UI.league&&["groupes","live"].includes(UI.tab)) await loadLeague(UI.league); render(true);},30000);
}
function readHash(){
  const h=decodeURIComponent(location.hash.slice(1));
  UI.admin=h==="admin";
  const m=h.match(/^rejoindre-([A-Za-z]+-\d{4})$/); if(m){pendingJoin=m[1].toUpperCase();UI.tab="groupes";}
}
window.addEventListener("hashchange",()=>{readHash();if(pendingJoin&&P) doJoin(pendingJoin).then(()=>render());else render();});

/* ===================== VUES ===================== */
const TABS=[["groupes","👯","Groupes"],["noter","⭐","Noter"],["top","🏆","Mon top"],["prono","🔮","Prono"],["live","📺","Live"]];
function render(soft){
  const app=document.getElementById("app"), nav=document.getElementById("navbar");
  if(UI.admin){nav.style.display="none";app.innerHTML=vAdmin();return;}
  if(!P){nav.style.display="none";app.innerHTML=vWelcome();return;}

async function copyText(t){try{await navigator.clipboard.writeText(t);toast("Copié ! 📋");return true;}catch(e){modal(`<p style="margin-bottom:8px">Copie ce texte :</p><textarea class="copyarea" readonly>${esc(t)}</textarea><button class="btn sm" data-a="closemodal" style="margin-top:10px">Fermer</button>`);return false;}}
function pick(obj,level,id){
  const ord=obj.order||obj.ord, key=obj.order?"order":"ord";
  if(level===15){
    if(obj.top15.includes(id)){obj.top15=obj.top15.filter(x=>x!==id);obj.top5=obj.top5.filter(x=>x!==id);obj[key]=ord.map(x=>x===id?null:x);}
    else if(obj.top15.length<15) obj.top15=[...obj.top15,id]; else {toast("Déjà 15 sélectionnées");return false;}
  }else if(level===5){
    if(!obj.top15.includes(id)) return false;
    if(obj.top5.includes(id)){obj.top5=obj.top5.filter(x=>x!==id);obj[key]=ord.map(x=>x===id?null:x);}
    else if(obj.top5.length<5) obj.top5=[...obj.top5,id]; else {toast("Déjà 5 finalistes");return false;}
  }else{
    if(!obj.top5.includes(id)) return false;
    const o=[...ord],i=o.indexOf(id); if(i>=0) o[i]=null; else {const f=o.indexOf(null); if(f<0) return false; o[f]=id;} obj[key]=o;
  }
  return true;
}

function locked(){if(R.votes_locked){toast(ERRORS.VOTES_LOCKED,true);return true;}return false;}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]"); if(!b||b.disabled) return;
  const a=b.dataset.a, v=b.dataset.v;
  switch(a){
    case "closemodal": if(e.target===b||b.tagName==="BUTTON") closeModal(); return;
    case "welcome": UI.welcome=v; break;
    case "wemoji": UI.emoji=v; document.querySelectorAll("[data-a=wemoji]").forEach(x=>x.classList.toggle("on",x.dataset.v===v)); return;
    case "tab": UI.tab=v; window.scrollTo(0,0); if(v==="live"||v==="top") refreshShared().then(()=>render(true)); break;
    case "filter": UI.filter=v; break;
    case "open": UI.open=UI.open===v?null:v; break;
    case "note": { if(locked()) return; const notes=JSON.parse(JSON.stringify(P.notes||{})); const n=notes[b.dataset.c]||(notes[b.dataset.c]={}); const val=+v;
      if(n[b.dataset.k]===val) delete n[b.dataset.k]; else n[b.dataset.k]=val; P.notes=notes; patch({notes}); recomputeTop5(); break; }
    case "next": { const i=CANDS.findIndex(c=>c.id===v); const nx=CANDS.slice(i+1).concat(CANDS.slice(0,i)).find(c=>!done(P,c.id)); UI.open=nx?nx.id:null; if(!nx) toast("Toutes notées 🎉");
      setTimeout(()=>{const el=document.querySelector(".cand.open"); el&&el.scrollIntoView({behavior:"smooth",block:"start"});},30); break; }
    case "coeur": if(locked()) return; patch({coeur:P.coeur===v?null:v}); if(P.coeur) toast(`❤️ Coup de cœur : Miss ${BY[v].region}`); break;
    case "pick": {
      if(b.dataset.ns==="res"){ const r={top15:[...R.top15],top5:[...R.top5],ord:[...R.ord]}; if(!pick(r,+b.dataset.l,v)) return;
        Object.assign(R,r); render(); try{await API.adminSetResults(UI.adminPwd,r);}catch(err){toast(errMsg(err),true);} return; }
      if(locked()) return; const pr=JSON.parse(JSON.stringify(P.prono||EMPTY_PRONO())); if(!pick(pr,+b.dataset.l,v)) return; patch({prono:pr}); break; }
    case "league": UI.league=v; ls.set("cp-league",v); await loadLeague(v); break;
    case "share": { const l=LEAGUES.find(x=>x.id===v); const url=location.origin+location.pathname+"#rejoindre-"+l.code;
      const t=`Rejoins mon groupe « ${l.name} » sur L'Élue 👑\nOn note les candidates et on fait nos pronos avant l'élection !\nCode : ${l.code}\n${url}`;
      if(navigator.share){try{await navigator.share({text:t});return;}catch(err){}} copyText(t); return; }
    case "leave": confirmBox("Quitter ce groupe ? Tes notes et ton prono sont conservés.",async()=>{try{await API.leaveLeague(v,P.id);UI.league=null;await refreshLeagues();render();}catch(err){toast(errMsg(err),true);}}); return;
    case "emoji": patch({emoji:v}); break;
    case "mode": if(locked()) return; patch({mode:v}); recomputeTop5(); break;
    case "crit": { if(locked()) return; const c=new Set(P.crits||[]); c.has(v)?c.delete(v):c.add(v); patch({crits:[...c]}); recomputeTop5(); break; }
    case "showcode": try{UI.rcode=await API.recoveryCode();}catch(err){toast(errMsg(err),true);} break;
    case "copytop": { const r=ranking(P).slice(0,5); copyText(`Mon top 5 ${P.emoji}\n`+r.map((x,i)=>`${i+1}. Miss ${x.c.region} (${x.s.toFixed(1)})`).join("\n")+(P.coeur?`\n❤️ Coup de cœur : Miss ${BY[P.coeur].region}`:"")+"\n#LElue #MissFrance2027"); return; }
    case "alock": try{await API.adminSetLock(UI.adminPwd,!R.votes_locked);R.votes_locked=!R.votes_locked;toast(R.votes_locked?"Votes fermés 🔒":"Votes rouverts");}catch(err){toast(errMsg(err),true);} break;
    case "aclear": confirmBox("Effacer tous les résultats officiels ?",async()=>{const r={top15:[],top5:[],ord:[null,null,null,null,null]};try{await API.adminSetResults(UI.adminPwd,r);Object.assign(R,r);render();}catch(err){toast(errMsg(err),true);}}); return;
    case "arefresh": await refreshShared(); toast("À jour"); break;
    case "acopy": { const ft=(F?.ranking||[]).slice(0,5), wp=F?.winner_prono||[], tot=wp.reduce((a,b)=>a+b.n,0);
      copyText(`🇫🇷 Le top 5 de la France (${F?.voters||0} joueuses)\n`+ft.map((x,i)=>`${i+1}. Miss ${BY[x.cand].region}`).join("\n")+(wp.length?`\n\n👑 Pour la France, Miss France sera : Miss ${BY[wp[0].cand].region} (${Math.round(wp[0].n/tot*100)} %)`:"")+"\n#LElue"); return; }
  }
  render();
});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const id=e.target.id, btn=e.target.querySelector("button:not([type=button])"); if(btn) btn.disabled=true;
  try{
    if(id==="fwelcome"){ const name=document.getElementById("wname").value.trim(); if(!name){toast("Choisis un prénom 😉");return;}
      if(!await API.session()) await API.signIn(); P=await API.myProfile()||await API.createProfile(name,UI.emoji);
      await refreshLeagues(); if(pendingJoin) await doJoin(pendingJoin); toast(`Bienvenue ${P.name} ${P.emoji}`); render(); }
    if(id==="frecover"){ const code=document.getElementById("rcode").value.trim(); if(!code) return;
      if(!await API.session()) await API.signIn(); await API.recover(code); P=await API.myProfile(); await refreshLeagues(); toast(`Re-bonjour ${P.name} ${P.emoji}`); render(); }
    if(id==="fcreate"){ const l=await API.createLeague(document.getElementById("lname").value.trim()); UI.league=l.id; ls.set("cp-league",l.id); await refreshLeagues(); render(); toast(`Groupe créé : ${l.code} 🎉`); }
    if(id==="fjoin"){ const code=document.getElementById("jcode").value.trim(); if(code){await doJoin(code); render();} }
    if(id==="fname"){ const name=document.getElementById("pname").value.trim(); if(name){patch({name}); toast("Prénom modifié"); render();} }
    if(id==="fadmin"){ const pwd=document.getElementById("apwd").value; if(await API.adminCheck(pwd)){UI.adminPwd=pwd; await refreshShared(); render();} else toast(ERRORS.NOT_ADMIN,true); }
  }catch(err){toast(errMsg(err),true);}
  finally{if(btn&&document.body.contains(btn)) btn.disabled=false;}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){UI.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById("q");q.focus();q.setSelectionRange(pos,pos);}
});
document.addEventListener("visibilitychange",async()=>{if(!document.hidden&&P){await refreshShared();if(UI.league) await loadLeague(UI.league);render(true);}});
boot();
</script>
</body>
</html>
