nav{position:fixed;left:0;right:0;bottom:0;background:rgba(23,13,36,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:10}
nav .wrap{display:flex;justify-content:space-between;padding:6px 8px 12px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);padding:6px 0;border-radius:12px;font-weight:500}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav button.on{color:var(--gold)}
h1{font-family:"Playfair Display",serif;font-size:34px;line-height:1.1;margin:8px 0}
h2{font-family:"Playfair Display",serif;font-size:24px;margin:14px 0 4px}

.sw.on{background:var(--gold2)} .sw.on::after{left:22px}

.emojis{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

function persoResult(ans){
  const tags={}; ans.forEach((a,i)=>{ if(a==null) return; PERSO_Q[i][1][a][1].forEach(t=>tags[t]=(tags[t]||0)+1); });
  const seed=ans.join("").split("").reduce((h,c)=>(h*31+c.charCodeAt(0))%9973,7);
  const sc=CANDS.map((c,k)=>{const tg=PERSO[c.id][0];const s=tg.reduce((a,t)=>a+(tags[t]||0),0)/Math.sqrt(tg.length);return {id:c.id,s:s+((k*37+seed)%31)/1000,common:tg.filter(t=>tags[t])};});
  sc.sort((a,b)=>b.s-a.s); return sc[0];
}

function makeApi(){
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const ok = ({data,error})=>{ if(error) throw error; return data; };
  let uid=null;
  return {
    async session(){ const {data}=await sb.auth.getSession(); uid=data.session?.user?.id||null; return uid; },
    async signIn(){ const d=ok(await sb.auth.signInAnonymously()); uid=d.user.id; return uid; },
    async myProfile(){ const d=ok(await sb.rpc("my_profile")); return d&&d.id?d:null; },
    async createProfile(name,emoji){ ok(await sb.from("profiles").insert({name,emoji})); return this.myProfile(); },
    async saveProfile(id,patch){ ok(await sb.from("profiles").update(patch).eq("id",id)); },
    async recoveryCode(){ return ok(await sb.rpc("my_recovery_code")); },
    async recover(code){ return ok(await sb.rpc("recover_profile",{p_code:code})); },
    async createLeague(name){ return ok(await sb.rpc("create_league",{p_name:name})); },
    async joinLeague(code){ return ok(await sb.rpc("join_league",{p_code:code})); },
    async leaveLeague(leagueId,profileId){ return ok(await sb.from("league_members").delete().eq("league_id",leagueId).eq("profile_id",profileId)); },
    async myLeagues(){ return ok(await sb.rpc("my_leagues"))||[]; },
    async leagueProfiles(id){ return ok(await sb.rpc("league_profiles",{p_league:id}))||[]; },
    async stats(){ return ok(await sb.rpc("france_stats")); },
    async franceRound(n){ return ok(await sb.rpc("france_round",{n})); },
    async results(){ return ok(await sb.from("results").select("*").eq("id",1).single()); },
    onResults(cb){ sb.channel("results").on("postgres_changes",{event:"*",schema:"public",table:"results"},p=>cb(p.new)).subscribe(); },
    async adminCheck(pwd){ return ok(await sb.rpc("admin_check",{p_pwd:pwd})); },
    async adminSetResults(pwd,r){ return ok(await sb.rpc("admin_set_results",{p_pwd:pwd,p_top15:r.top15,p_top5:r.top5,p_ord:r.ord})); },
    async adminSetState(pwd,s){ return ok(await sb.rpc("admin_set_state",{p_pwd:pwd,p_manche:s.manche,p_locked:s.locked,p_show_at:s.show_at,p_close_at:s.close_at})); },
    async adminFranceRound(pwd,n){ return ok(await sb.rpc("admin_france_round",{p_pwd:pwd,n})); },
    async adminReset(pwd){ return ok(await sb.rpc("admin_reset_night",{p_pwd:pwd})); }
  };
}

const critsOf=p=>p.mode==="global"?[{id:"global",label:"Note globale"}]:CRITS.filter(c=>(p.crits||[]).includes(c.id));
function avg(p,cid){const n=(p.notes||{})[cid];if(!n)return null;const v=critsOf(p).map(c=>n[c.id]).filter(x=>typeof x==="number");return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
const done=(p,cid)=>{const n=(p.notes||{})[cid]||{};const c=critsOf(p);return c.length>0&&c.every(k=>typeof n[k.id]==="number");};
const notesOrder=p=>CANDS.map(c=>({c,s:avg(p,c.id)})).sort((a,b)=>(b.s??-1)-(a.s??-1)||a.c.n-b.c.n).map(x=>x.c.id);
const pool=n=>n===1?CANDS.map(c=>c.id):n===2?R.top15:R.top5;
const resultReady=n=>n===1?R.top15.length===15:n===2?R.top5.length===5:R.ord.every(Boolean);
function filterTo(order,ids){const s=new Set(ids);const out=order.filter(x=>s.has(x));ids.forEach(x=>{if(!out.includes(x))out.push(x);});return out;}
function roundOf(p,n){
  const r=(p.rounds||{})[n];
  if(Array.isArray(r)&&r.length) return filterTo(r,pool(n));
  if(n===1) return notesOrder(p);
  return filterTo(roundOf(p,n-1),pool(n));
}
const saved=(p,n)=>Array.isArray((p.rounds||{})[n]);
const inter=(a,b)=>a.filter(x=>b.includes(x)).length;
function pts(order,ref,n){
  if(n===1) return inter(order.slice(0,15),ref.slice(0,15));
  if(n===2) return 3*inter(order.slice(0,5),ref.slice(0,5));
  return (order[0]&&order[0]===ref[0]?10:0)+3*[1,2,3,4].filter(i=>order[i]&&order[i]===ref[i]).length;
}
const tvRef=n=>n===1?R.top15:n===2?R.top5:R.ord;
const frRef=n=>FR[n]&&!FR[n].hidden?filterTo(FR[n].order||[],pool(n)):null;
function scores(p){
  const out={tv:0,fr:0,by:{}};
  [1,2,3].forEach(n=>{
    const avail=n<R.manche||(n===R.manche&&R.votes_locked);
    if(n>R.manche) return;
    const ord=roundOf(p,n), b={tv:null,fr:null};
    if(resultReady(n)){b.tv=pts(ord,tvRef(n),n);out.tv+=b.tv;}
    const f=frRef(n); if(avail&&f&&f.length){b.fr=pts(ord,f,n);out.fr+=b.fr;}
    out.by[n]=b;
  });
  return out;
}

/* ===================== COMPTE À REBOURS ===================== */
function countdownTarget(){
  const now=Date.now();
  if(R.manche<=3&&!R.votes_locked&&R.close_at&&new Date(R.close_at)>now) return {label:`Fin de la manche ${R.manche} dans`,t:new Date(R.close_at)};
  if(R.manche===1&&!R.votes_locked&&new Date(R.show_at)>now) return {label:"L'élection commence dans",t:new Date(R.show_at)};
  return null;
}
function cdParts(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);return [Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];}
function vCountdown(){
  const c=countdownTarget();
  if(!c){
    let msg;
    if(R.manche>3) msg="La soirée est terminée. Merci d'avoir joué !";
    else if(R.votes_locked) msg=`Manche ${R.manche} fermée · place au verdict`;
    else msg=`Manche ${R.manche} ouverte · ferme bientôt`;
    return `<div class="box cd"><div class="lab">${msg}</div></div>`;
  }
  const [d,h,m,s]=cdParts(c.t-Date.now()), two=x=>String(x).padStart(2,"0");
  const showDays=d>0;
  return `<div class="box cd"><div class="lab">${c.label}</div><div class="digits">
    ${showDays?`<div><b id="cd0">${d}</b><small>jours</small></div>`:""}<div><b id="cd1">${two(h)}</b><small>heures</small></div>
    <div><b id="cd2">${two(m)}</b><small>min</small></div><div><b id="cd3">${two(s)}</b><small>sec</small></div></div></div>`;
}
function tick(){
  const c=countdownTarget(); const el=document.getElementById("cd3");
  if(!c||!el){ if(!c&&document.querySelector(".cd .digits")) render(true); return; }
  const [d,h,m,s]=cdParts(c.t-Date.now()), two=x=>String(x).padStart(2,"0");
  const set=(id,v)=>{const e=document.getElementById(id);if(e&&e.textContent!==String(v))e.textContent=v;};
  set("cd0",d);set("cd1",two(h));set("cd2",two(m));set("cd3",two(s));
}

/* ===================== GLISSER-DÉPOSER ===================== */
let DRAG=null, pressTimer=null, pressStart=null;
document.addEventListener("touchmove",e=>{if(DRAG)e.preventDefault();},{passive:false});
document.addEventListener("contextmenu",e=>{if(DRAG||e.target.closest(".rank li"))e.preventDefault();});
document.addEventListener("pointerdown",e=>{
  const li=e.target.closest("#rank li[data-id]"); if(!li||e.target.closest("[data-a=moveto]")) return;
  if(e.target.closest(".handle")){e.preventDefault();startDrag(li,e);return;}
  pressStart={x:e.clientX,y:e.clientY,id:e.pointerId};
  clearTimeout(pressTimer); pressTimer=setTimeout(()=>{if(pressStart){navigator.vibrate&&navigator.vibrate(15);startDrag(li,{clientX:pressStart.x,clientY:pressStart.y,pointerId:pressStart.id});}},380);
});
document.addEventListener("pointermove",e=>{
  if(pressStart&&!DRAG&&Math.hypot(e.clientX-pressStart.x,e.clientY-pressStart.y)>8){clearTimeout(pressTimer);pressStart=null;}
  if(!DRAG) return; e.preventDefault(); DRAG.y=e.clientY; moveGhost();
});
document.addEventListener("pointerup",endPress); document.addEventListener("pointercancel",endPress);
function endPress(){clearTimeout(pressTimer);pressStart=null;if(DRAG)endDrag();}
function startDrag(li,e){
  const list=document.getElementById("rank"), r=li.getBoundingClientRect();
  const ph=document.createElement("li"); ph.className="ph"; ph.style.height=r.height+"px";
  li.parentNode.insertBefore(ph,li);
  li.classList.add("ghost"); li.style.width=r.width+"px"; li.style.left=r.left+"px"; li.style.top=r.top+"px";
  DRAG={li,ph,list,off:e.clientY-r.top,y:e.clientY}; document.body.classList.add("dragging");
  const loop=()=>{ if(!DRAG) return; const y=DRAG.y, H=window.innerHeight;
    if(y<110) window.scrollBy(0,-Math.ceil((110-y)/6)); else if(y>H-150) window.scrollBy(0,Math.ceil((y-(H-150))/6));
    moveGhost(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
function moveGhost(){
  const {li,ph,list,off,y}=DRAG; li.style.top=(y-off)+"px";
  const items=[...list.querySelectorAll("li[data-id]:not(.ghost)")];
  let before=null; for(const it of items){const r=it.getBoundingClientRect(); if(y<r.top+r.height/2){before=it;break;}}
  if(before){ if(ph.nextElementSibling!==before) list.insertBefore(ph,before.previousElementSibling&&before.previousElementSibling.classList.contains("cut")?before.previousElementSibling:before); }
  else if(list.lastElementChild!==ph) list.appendChild(ph);
}
function endDrag(){
  const {li,ph,list}=DRAG; list.insertBefore(li,ph); ph.remove();
  li.classList.remove("ghost"); li.style.cssText=""; DRAG=null; document.body.classList.remove("dragging");
  const order=[...list.querySelectorAll("li[data-id]")].map(x=>x.dataset.id), n=+list.dataset.n;
  if(order.join()!==roundOf(P,n).join()){ if(!isOpen()||n!==R.manche){toast(ERRORS.VOTES_LOCKED,true);render();return;} saveRound(n,order); }
  render();
}

  const gold=g.createLinearGradient(240,0,840,0); gold.addColorStop(0,"#f2c46d"); gold.addColorStop(.5,"#fff1cf"); gold.addColorStop(1,"#e0a63a");

}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

function showStory(s){ const file=new File([s.blob],"lelue.png",{type:"image/png"});
  modal(`<img class="storyprev" src="${s.url}" alt="Ma story L'Élue"><div class="row"><button class="btn gold grow" id="sshare">Partager</button><a class="btn" href="${s.url}" download="lelue.png">Télécharger</a></div><button class="btn sm ghost wide" data-a="closemodal" style="margin-top:8px">Fermer</button>`);
  document.getElementById("sshare").onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file],text:`Sur L'Élue 👑 ${SITE}`}); else toast("Utilise « Télécharger » puis poste l'image en story");}catch(err){}};
}
async function makeQuizStory(note){
  const cv=document.createElement("canvas"); cv.width=1080; cv.height=1920; const g=cv.getContext("2d");
  try{await document.fonts.load("italic 800 150px 'Playfair Display'");await document.fonts.load("800 300px 'Playfair Display'");await document.fonts.load("500 40px 'DM Sans'");}catch(e){}
  const bg=g.createRadialGradient(540,200,50,540,700,1400); bg.addColorStop(0,"#3b1f63"); bg.addColorStop(1,"#120a1d"); g.fillStyle=bg; g.fillRect(0,0,1080,1920);
  const gold=g.createLinearGradient(200,0,880,0); gold.addColorStop(0,"#f2c46d"); gold.addColorStop(.5,"#fff1cf"); gold.addColorStop(1,"#e0a63a");
  g.textAlign="center"; g.fillStyle=gold; g.font="italic 800 150px 'Playfair Display'"; g.fillText("L'Élue",540,290);
  g.fillStyle="#b9a8cc"; g.font="500 48px 'DM Sans'"; g.fillText("Le test de culture G des Miss",540,560); g.fillText("j'ai eu…",540,630);
  g.fillStyle=gold; g.font="800 300px 'Playfair Display'"; g.fillText(String(note).replace(".",","),540,1010);
  g.fillStyle="#b9a8cc"; g.font="800 110px 'Playfair Display'"; g.fillText("/ 20",540,1150);
  g.fillStyle="#f6effa"; g.font="700 52px 'DM Sans'"; g.fillText("Et toi, tu aurais eu combien ?",540,1500);
  g.fillStyle="#f2c46d"; g.font="700 44px 'DM Sans'"; g.fillText(SITE,540,1830);
  return new Promise(res=>cv.toBlob(b=>res({blob:b,url:cv.toDataURL("image/png")}),"image/png"));
}
/* ===================== ACTIONS ===================== */
function modal(html){document.getElementById("overlay").innerHTML=`<div class="modal" data-a="closemodal"><div class="box">${html}</div></div>`;}
function closeModal(){document.getElementById("overlay").innerHTML="";}
function confirmBox(text,ok){modal(`<p style="margin-bottom:14px">${text}</p><div class="row" style="justify-content:flex-end"><button class="btn sm" data-a="closemodal">Annuler</button><button class="btn sm gold" id="cyes">Confirmer</button></div>`);document.getElementById("cyes").onclick=()=>{closeModal();ok();};}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("Copié !");return true;}catch(e){modal(`<p style="margin-bottom:8px">Copie ce texte :</p><textarea class="copyarea" readonly>${esc(t)}</textarea><button class="btn sm" data-a="closemodal" style="margin-top:10px">Fermer</button>`);return false;}}
async function doJoin(code){
  pendingJoin=null; if(location.hash.startsWith("#rejoindre")) history.replaceState(null,"",location.pathname);
  try{const l=await API.joinLeague(code);toast(`Bienvenue dans « ${l.name} »`);UI.league=l.id;ls.set("cp-league",l.id);UI.tab="groupes";await refreshLeagues();}
  catch(e){toast(errMsg(e),true);}
}
async function adminDo(fn){try{await fn();await refreshShared();UI.adminFR={};render();}catch(err){toast(errMsg(err),true);}}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]"); if(!b||b.disabled) return;
  const a=b.dataset.a, v=b.dataset.v;
  switch(a){
    case "closemodal": if(e.target===b||b.tagName==="BUTTON") closeModal(); return;
    case "welcome": UI.welcome=v; break;
    case "wemoji": UI.emoji=v; document.querySelectorAll("[data-a=wemoji]").forEach(x=>x.classList.toggle("on",x.dataset.v===v)); return;
    case "tab": UI.tab=v; window.scrollTo(0,0); if(v==="resultats"||v==="jouer") refreshShared().then(()=>render(true)); if(v==="groupes"&&UI.league) loadLeague(UI.league).then(()=>render(true)); break;
    case "filter": UI.filter=v; break;
    case "open": UI.open=UI.open===v?null:v; break;
    case "note": { const notes=JSON.parse(JSON.stringify(P.notes||{})); const n=notes[b.dataset.c]||(notes[b.dataset.c]={}); const val=+v;
      if(n[b.dataset.k]===val) delete n[b.dataset.k]; else n[b.dataset.k]=val; patch({notes}); break; }
    case "next": { const i=CANDS.findIndex(c=>c.id===v); const nx=CANDS.slice(i+1).concat(CANDS.slice(0,i)).find(c=>!done(P,c.id)); UI.open=nx?nx.id:null; if(!nx) toast("Toutes notées !");
      setTimeout(()=>{const el=document.querySelector(".cand.open"); el&&el.scrollIntoView({behavior:"smooth",block:"start"});},30); break; }
    case "coeur": patch({coeur:P.coeur===v?null:v}); if(P.coeur) toast(`Coup de cœur : Miss ${BY[v].region}`); break;
    case "test": UI.test=v||null; window.scrollTo(0,0); break;
    case "pstart": UI.ps={i:0,ans:[],started:true,done:false}; pSave(); window.scrollTo(0,0); break;
    case "pans": { const q=pState(); q.ans[q.i]=+v; if(q.i<PERSO_Q.length-1) q.i++; else q.done=true; pSave(); window.scrollTo(0,0); break; }
    case "pprev": { const q=pState(); if(q.i>0) q.i--; pSave(); break; }
    case "psoul": patch({soulmate:v}); toast(`Miss ${BY[v].region} est ta Miss de cœur ⭐`); break;
    case "pstory": showStory(await makePersoStory(v)); return;
    case "qstart": UI.qz={i:0,ans:[],started:true,done:false}; qSave(); window.scrollTo(0,0); break;
    case "qans": { const q=qState(); q.ans[q.i]=+v; if(q.i<QUIZ.length-1) q.i++; else { q.done=true; const c=qCorrect(q.ans);
        if(!P.quiz_total){ patch({quiz_score:c,quiz_total:QUIZ.length}); refreshShared().then(()=>render(true)); } }
      qSave(); window.scrollTo(0,0); break; }
    case "qprev": { const q=qState(); if(q.i>0) q.i--; qSave(); break; }
    case "qquit": confirmBox("Abandonner le test ? Tes réponses seront perdues.",()=>{UI.qz={i:0,ans:[],started:false,done:false};qSave();render();}); return;
    case "qstory": { const q=qState(); const s=await makeQuizStory(qNote(qCorrect(q.ans))); showStory(s); return; }
    case "sendr1": saveRound(1,roundOf(P,1)); toast("Classement envoyé !"); break;
    case "resort": confirmBox("Re-trier ton classement d'après tes notes ? Tes déplacements à la main seront remplacés.",()=>{saveRound(1,notesOrder(P));render();}); return;
    case "moveto": { if(!isOpen()) return; const n=R.manche, order=roundOf(P,n), i=order.indexOf(v);
      modal(`<p style="margin-bottom:10px">Déplacer <b>Miss ${BY[v].region}</b> à la place n°</p><form id="fmove" class="row"><input class="field grow" id="mpos" type="number" min="1" max="${order.length}" value="${i+1}" inputmode="numeric"><button class="btn gold">OK</button></form><input type="hidden" id="mid" value="${v}">`);
      setTimeout(()=>{const x=document.getElementById("mpos");x&&x.select();},50); return; }
    case "story": { showStory(await makeStory()); return; }
    case "league": UI.league=v; ls.set("cp-league",v); await loadLeague(v); break;
    case "share": { const l=LEAGUES.find(x=>x.id===v); const url=location.origin+location.pathname+"#rejoindre-"+l.code;
      const t=`Rejoins mon groupe « ${l.name} » sur L'Élue 👑\nOn note les candidates et on fait nos pronos avant l'élection !\nCode : ${l.code}\n${url}`;
      if(navigator.share){try{await navigator.share({text:t});return;}catch(err){}} copyText(t); return; }
    case "leave": confirmBox("Quitter ce groupe ? Tes notes et ton classement sont conservés.",async()=>{try{await API.leaveLeague(v,P.id);UI.league=null;await refreshLeagues();render();}catch(err){toast(errMsg(err),true);}}); return;
    case "emoji": patch({emoji:v}); break;
    case "mode": patch({mode:v}); break;
    case "crit": { const c=new Set(P.crits||[]); c.has(v)?c.delete(v):c.add(v); patch({crits:[...c]}); break; }
    case "showcode": try{UI.rcode=await API.recoveryCode();}catch(err){toast(errMsg(err),true);} break;
    /* admin */
    case "alock": confirmBox(`Fermer la manche ${R.manche} ? Plus personne ne pourra modifier son classement, et le classement de la France sera révélé.`,()=>adminDo(()=>API.adminSetState(UI.adminPwd,{manche:R.manche,locked:true,show_at:R.show_at,close_at:null}))); return;
    case "aunlock": UI.adminPick=null; adminDo(()=>API.adminSetState(UI.adminPwd,{manche:R.manche,locked:false,show_at:R.show_at,close_at:R.close_at})); return;
    case "apick": { const pk=UI.adminPick, l=+b.dataset.l;
      if(l===15){pk.top15=pk.top15.includes(v)?pk.top15.filter(x=>x!==v):pk.top15.length<15?[...pk.top15,v]:pk.top15;}
      else if(l===5){pk.top5=pk.top5.includes(v)?pk.top5.filter(x=>x!==v):pk.top5.length<5?[...pk.top5,v]:pk.top5;}
      else{const o=[...pk.ord],i=o.indexOf(v); if(i>=0)o[i]=null; else{const f=o.indexOf(null); if(f>=0)o[f]=v;} pk.ord=o;}
      break; }
    case "anext": { const pk=UI.adminPick, n=R.manche;
      const res=n===1?{top15:pk.top15,top5:[],ord:[null,null,null,null,null]}:n===2?{top15:R.top15,top5:pk.top5,ord:[null,null,null,null,null]}:{top15:R.top15,top5:R.top5,ord:pk.ord};
      const txt=n===1?"Valider ce top 15 et ouvrir la manche 2 ?":n===2?"Valider ce top 5 et ouvrir la manche 3 ?":"Valider le résultat final ? Les points seront calculés pour tout le monde.";
      confirmBox(txt,()=>adminDo(async()=>{await API.adminSetResults(UI.adminPwd,res); await API.adminSetState(UI.adminPwd,{manche:n+1,locked:n===3,show_at:R.show_at,close_at:null}); UI.adminPick=null;})); return; }
    case "atimes": { const s=document.getElementById("ashow").value, c=document.getElementById("aclose").value;
      adminDo(()=>API.adminSetState(UI.adminPwd,{manche:R.manche,locked:R.votes_locked,show_at:s?new Date(s).toISOString():R.show_at,close_at:c?new Date(c).toISOString():null})); toast("Horaires enregistrés"); return; }
    case "afr": try{UI.adminFR[v]=await API.adminFranceRound(UI.adminPwd,+v);}catch(err){toast(errMsg(err),true);} break;
    case "arefresh": await refreshShared(); UI.adminFR={}; toast("À jour"); break;
    case "areset": confirmBox("Réinitialiser la soirée ? Retour à la manche 1, résultats officiels effacés, manches 2 et 3 effacées pour tout le monde.",()=>adminDo(async()=>{await API.adminReset(UI.adminPwd);UI.adminPick=null;})); return;
    case "acopy": { const lines=[`L'Élue · ${STATS?.players||0} joueuses`];
      for(const k of [1,2,3]){ if(k>R.manche) break; let f=UI.adminFR[k]; if(!f){try{f=UI.adminFR[k]=await API.adminFranceRound(UI.adminPwd,k);}catch(err){}} if(f&&f.order.length) lines.push(`\nManche ${k} · le choix de la France :\n`+filterTo(f.order,pool(k)).slice(0,MANCHES[k].k).map((id,i)=>`${i+1}. Miss ${BY[id].region}`).join("\n")); }
      copyText(lines.join("\n")+"\n#LElue #MissFrance2027"); render(); return; }
  }
  render();
});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const id=e.target.id, btn=e.target.querySelector("button:not([type=button])"); if(btn) btn.disabled=true;
  try{
    if(id==="fwelcome"){ const name=document.getElementById("wname").value.trim(); if(!name){toast("Choisis un prénom");return;}
      if(!await API.session()) await API.signIn(); P=await API.myProfile()||await API.createProfile(name,UI.emoji);
      await refreshLeagues(); if(pendingJoin) await doJoin(pendingJoin); toast(`Bienvenue ${P.name} ${P.emoji}`); render(); }
    if(id==="frecover"){ const code=document.getElementById("rcode").value.trim(); if(!code) return;
      if(!await API.session()) await API.signIn(); await API.recover(code); P=await API.myProfile(); await refreshLeagues(); toast(`Re-bonjour ${P.name} ${P.emoji}`); render(); }
    if(id==="fcreate"){ const l=await API.createLeague(document.getElementById("lname").value.trim()); UI.league=l.id; ls.set("cp-league",l.id); await refreshLeagues(); render(); toast(`Groupe créé : ${l.code}`); }
    if(id==="fjoin"){ const code=document.getElementById("jcode").value.trim(); if(code){await doJoin(code); render();} }
    if(id==="fname"){ const name=document.getElementById("pname").value.trim(); if(name){patch({name}); toast("Prénom modifié"); render();} }
    if(id==="fmove"){ const v=document.getElementById("mid").value, n=R.manche, order=roundOf(P,n).filter(x=>x!==v);
      let pos=Math.max(1,Math.min(order.length+1,parseInt(document.getElementById("mpos").value)||1)); order.splice(pos-1,0,v); saveRound(n,order); closeModal(); render(); }
    if(id==="fadmin"){ const pwd=document.getElementById("apwd").value; if(await API.adminCheck(pwd)){UI.adminPwd=pwd; await refreshShared(); render();} else toast(ERRORS.NOT_ADMIN,true); }
  }catch(err){toast(errMsg(err),true);}
  finally{if(btn&&document.body.contains(btn)) btn.disabled=false;}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){UI.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById("q");q.focus();q.setSelectionRange(pos,pos);}
});
document.addEventListener("visibilitychange",async()=>{if(!document.hidden&&P){await refreshShared();if(UI.league) await loadLeague(UI.league);render(true);}});
boot();
</script>
