<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Élue · Admin</title>
<meta name="description" content="Note les candidates, fais ton classement et compare-toi à tes copines et à toute la France.">
<meta name="theme-color" content="#1B0E22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Admin">
<link rel="icon" type="image/png" href="/icons/admin-favicon-48.png">
<link rel="apple-touch-icon" href="/icons/admin-180.png">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500;1,6..96,700&family=Cormorant+Garamond:ital,wght@1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--nuit:#1B0E22;--velours:#2A1434;--ivoire:#FBF3E6;--brume:#C9B6CF;--or:#E9BF62;--or2:#C8932F;--line:rgba(233,191,98,.18);--card:rgba(255,255,255,.045);--ok:#9FE3BF;--bad:#FF9A9A;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--nuit)}
body{color:var(--ivoire);font-family:"Jost",system-ui,sans-serif;font-weight:300;font-size:16px;line-height:1.45;min-height:100vh;padding-bottom:96px;background:var(--nuit)}
body.dragging{user-select:none;-webkit-user-select:none}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 60% at 50% 0%,#4A2157 0%,#2A1434 40%,#1B0E22 78%)}
#bg .beams{position:absolute;inset:0;opacity:0;transition:opacity .6s}
#bg .beam{position:absolute;top:-40px;width:190px;height:620px;transform-origin:50% 0;filter:blur(10px);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);background:linear-gradient(180deg,rgba(255,236,190,.26),rgba(255,236,190,0) 85%)}
#bg .beam.l{left:calc(50% - 215px);animation:swayL 9s ease-in-out infinite}#bg .beam.r{right:calc(50% - 215px);animation:swayR 11s ease-in-out infinite}
@keyframes swayL{0%,100%{transform:rotate(18deg)}50%{transform:rotate(4deg)}}
@keyframes swayR{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(-5deg)}}
#bg canvas{position:absolute;inset:0;width:100%;height:100%}
#app{position:relative;z-index:1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
input{font:inherit;color:inherit}
a{color:var(--or)}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
.shine{background:linear-gradient(100deg,#B8862F 0%,#F6DA8E 38%,#FFF8E1 50%,#F6DA8E 62%,#B8862F 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tshine 5.5s ease-in-out infinite}
@keyframes tshine{0%{background-position:100% 0}100%{background-position:-60% 0}}
.goldtx{background:linear-gradient(180deg,#FFF3C9 0%,#F2CF7E 40%,#C8932F 65%,#F6DC92 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
header{padding:14px 0 6px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px}
.brand img{width:34px;height:auto;filter:drop-shadow(0 0 6px rgba(246,218,142,.35))}
.logo{font:italic 700 26px/1.3 "Bodoni Moda",serif;padding-top:2px}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:400;font-size:14px}
.me .av{width:28px;height:28px;font-size:15px}
.sync{font-size:11px;color:var(--brume);min-width:12px;text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:linear-gradient(180deg,rgba(27,14,34,0),rgba(27,14,34,.94) 30%)}
nav .wrap{display:flex;justify-content:space-between;padding:16px 4px 14px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--brume);padding:4px 0;position:relative}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
nav button.on{color:var(--ivoire)}
nav button.on::after{content:"";position:absolute;bottom:-6px;width:18px;height:2px;border-radius:2px;background:linear-gradient(90deg,#C8932F,#F6DA8E,#C8932F)}
nav button.on svg{stroke:var(--or)}
h1{font:italic 700 40px/1.15 "Bodoni Moda",serif;margin:8px 0}
h2{font:italic 700 32px/1.25 "Bodoni Moda",serif;margin:26px 0 4px;padding-top:4px}
h3{font:italic 700 21px/1.3 "Bodoni Moda",serif;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sub{color:var(--brume);font-size:15px;margin-bottom:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.box>h3:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.btn{padding:11px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(233,191,98,.4);font-weight:400;color:var(--ivoire)}
.btn.gold,.cta{position:relative;overflow:hidden;isolation:isolate;border:0;color:#2A1606;font-weight:500;
  background:linear-gradient(135deg,#B8862F 0%,#F6DC92 28%,#FFF1C8 40%,#D9A84A 62%,#F2D184 82%,#C8932F 100%);
  box-shadow:0 10px 28px rgba(233,191,98,.2),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(120,80,20,.35)}
.btn.gold::after,.cta::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:35%;z-index:-1;transform:skewX(-20deg);
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:sweep 5s ease-in-out infinite}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
.cta{display:block;width:100%;border-radius:16px;padding:20px 22px;text-align:center;margin:24px 0 6px}
.cta b{display:block;font:italic 700 26px/1.15 "Bodoni Moda",serif;color:#2A1606}
.cta small{display:block;font:400 14px "Jost";color:#4A2E10;margin-top:5px}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:12px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:rgba(255,154,154,.35)}
.field{width:100%;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);outline:none;color-scheme:dark;font-weight:400}
.field::placeholder{color:#9C87A3}
.field:focus{border-color:var(--or)}
.field.code{text-transform:uppercase;letter-spacing:1px;font-weight:500}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);gap:10px}
.toggle:last-child{border-bottom:0}
.sw{width:46px;height:27px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;transition:.2s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:linear-gradient(135deg,#C8932F,#F2D184)} .sw.on::after{left:22px}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:400;font-size:14px;color:var(--brume)}
.seg button.on{background:rgba(233,191,98,.16);color:var(--ivoire)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(233,191,98,.14);border:1px solid var(--line);font-size:18px;flex:0 0 auto}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.emojis button{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.05);font-size:20px;border:1px solid var(--line)}
.emojis button.on{border-color:var(--or);background:rgba(233,191,98,.16)}
/* héros : miroir de loge */
.hero{position:relative;margin:6px auto 0;padding:12px;border-radius:190px 190px 22px 22px;max-width:420px}
.hero .glass{position:relative;border-radius:178px 178px 14px 14px;padding:58px 16px 8px;text-align:center;background:radial-gradient(80% 55% at 50% 20%,rgba(255,226,170,.16),rgba(255,226,170,0) 72%)}
.hero .hello{font:300 15px "Jost";color:var(--brume);margin-bottom:2px}
.hero h1{font:italic 700 68px/1.2 "Bodoni Moda",serif;margin:0 0 4px;padding-top:6px}
.hero .tag{font:italic 400 20px/1.3 "Cormorant Garamond",serif;color:#E9DCEB}
.bulbs{position:absolute;inset:0;pointer-events:none;z-index:2}
.bulb{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#FFFFFF 0%,#FFFFFF 10%,#FFF7E0 24%,#FFE6AE 48%,#F7C878 74%,#E9A94E 100%);
  box-shadow:0 0 8px 2px rgba(255,226,160,.9),0 0 22px 8px rgba(255,196,110,.45),0 0 46px 16px rgba(255,180,90,.18);opacity:0;transition:opacity .3s,filter .2s,box-shadow .2s}
.bulb.lit{opacity:1}
.bulb.dim{filter:brightness(.55) saturate(.8);box-shadow:0 0 4px 1px rgba(255,214,140,.35)}
.cd{text-align:center;padding:14px 0 4px}
.cd .lab{font:italic 400 18px "Cormorant Garamond",serif;color:var(--brume)}
.cd .digits{display:flex;justify-content:center;gap:12px;margin-top:8px}
.cd .digits div{min-width:52px}
.cd .digits b{display:block;font:500 40px/1.1 "Bodoni Moda",serif;color:var(--ivoire);font-variant-numeric:lining-nums tabular-nums}
.cd .digits small{font-size:12px;color:var(--brume)}
.steps{display:flex;gap:6px;margin:16px 0 6px}
.steps div{flex:1;text-align:center;padding:9px 4px;border-radius:14px;background:var(--card);font-size:12px;color:var(--brume);border:1px solid var(--line)}
.steps div b{display:block;font:italic 700 16px "Bodoni Moda",serif;color:var(--ivoire)}
.steps div.cur{border-color:var(--or);background:rgba(233,191,98,.10)}
.steps div.cur b{color:var(--or)}
.steps div.done b{color:var(--ok)}
/* notes */
.cand{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:9px 0;overflow:hidden}
.cand.open{border-color:rgba(233,191,98,.55)}
.chead{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.num{width:38px;height:38px;border-radius:12px;background:rgba(233,191,98,.10);display:grid;place-items:center;font:700 16px "Bodoni Moda",serif;color:var(--or);flex:0 0 auto}
.cname{font-weight:400;font-size:16.5px;display:flex;align-items:center;gap:6px} .creg{color:var(--brume);font-size:13px}
.score{margin-left:auto;text-align:right;flex:0 0 auto}
.score b{font:500 22px "Bodoni Moda",serif;color:var(--or)}
.score small{display:block;color:var(--brume);font-size:11px}
.heart{padding:6px;flex:0 0 auto;margin-right:10px;color:#7E6585}
.heart svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.6}
.heart.on{color:#F2B8C8}.heart.on svg{fill:currentColor}
.tiny{width:20px;height:auto;vertical-align:middle;filter:drop-shadow(0 0 4px rgba(246,218,142,.4))}
.cbody{padding:2px 14px 14px;border-top:1px solid var(--line)}
.crit{margin-top:12px}
.crit .lab{font-size:13px;color:var(--brume);margin-bottom:6px;display:flex;justify-content:space-between}
.notes{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.notes button{height:34px;border-radius:9px;background:rgba(255,255,255,.06);font-weight:400;font-size:14px}
.notes button.on{background:linear-gradient(135deg,#C8932F,#F6DC92 50%,#D9A84A);color:#2A1606;font-weight:500}
.notes button.in{background:rgba(233,191,98,.22)}
.links{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.links a{font-size:13px;text-decoration:none;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ivoire)}
.prog{height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#C8932F,#F6DA8E)}
/* classement */
.rank{list-style:none;margin:6px 0}
.rank li{display:flex;align-items:center;gap:10px;padding:9px 8px 9px 10px;margin:6px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;touch-action:pan-y;-webkit-touch-callout:none}
.rank li.in{border-color:rgba(233,191,98,.38);background:linear-gradient(90deg,rgba(233,191,98,.10),rgba(255,255,255,.035) 60%)}
.rank li .pos{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font:700 18px "Bodoni Moda",serif;color:var(--brume);flex:0 0 auto}
.rank li.in .pos{color:var(--or)}
.rank li b{font-weight:400}
.rank li .handle{width:40px;height:40px;display:grid;place-items:center;color:#9C87A3;touch-action:none;flex:0 0 auto;cursor:grab}
.rank li .handle svg{width:20px;height:20px;fill:currentColor}
.rank li.ghost{position:fixed;z-index:50;box-shadow:0 14px 40px rgba(0,0,0,.55);border-color:var(--or);background:#3A1F44;transform:scale(1.02);pointer-events:none}
.rank .ph{height:56px;margin:6px 0;border-radius:16px;border:2px dashed rgba(233,191,98,.5);list-style:none}
.rank li.cut{display:block;background:none;border:0;border-top:1px solid rgba(233,191,98,.5);border-radius:0;padding:10px 0;margin:10px 0;text-align:center;font:italic 400 18px "Cormorant Garamond",serif;color:var(--or)}
.mk{font-size:11px;font-weight:500;padding:3px 8px;border-radius:999px;background:rgba(159,227,191,.14);color:var(--ok);flex:0 0 auto}
.rk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .pos{width:28px;font:700 20px "Bodoni Moda",serif;color:var(--brume);text-align:center;flex:0 0 auto}
.rk.p1 .pos,.rk.p2 .pos,.rk.p3 .pos{color:var(--or)}
.rk b{font-weight:400}
.rk .val{color:var(--or);font-weight:500;flex:0 0 auto}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pk{padding:7px 11px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13px}
.pk.on{background:rgba(233,191,98,.18);border-color:var(--or);color:#FFE9B5}
.pk .rkb{display:inline-block;min-width:16px;margin-right:4px;font-weight:600;color:var(--or)}
.counter{margin-left:auto;font:400 13px "Jost";color:var(--brume)} .counter.full{color:var(--ok)}
.lb{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:0}
.lb.mine{background:rgba(233,191,98,.08);margin:0 -16px;padding:11px 16px}
.lb b{font-weight:400}
.lb .tot{margin-left:auto;font:500 24px "Bodoni Moda",serif;color:var(--or)}
.det{font-size:12.5px;color:var(--brume)}
.pill{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--brume);font-weight:400}
.pill.ok{background:rgba(159,227,191,.14);color:var(--ok)} .pill.danger{background:rgba(255,120,120,.14);color:#ff9d9d} .pill.gold{background:rgba(233,191,98,.14);color:var(--or)}
.empty{text-align:center;color:var(--brume);padding:30px 10px}
.note{font-size:14px;color:#E9DCEB;background:rgba(233,191,98,.07);border:1px solid rgba(233,191,98,.25);padding:12px 14px;border-radius:14px;margin:10px 0}
.lock{font-size:14px;background:rgba(255,154,154,.08);border:1px solid rgba(255,154,154,.3);color:#FFD6D6;padding:12px 14px;border-radius:14px;margin:10px 0}
.bigcode{font:500 32px "Bodoni Moda",serif;letter-spacing:2px;text-align:center;padding:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;margin:8px 0;color:var(--or)}
.grp{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.grp:last-child{border-bottom:0}
.grp b{font-weight:400}
.stat{display:flex;gap:10px}
.stat>div{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;font-size:13px;color:var(--brume)}
.stat b{display:block;font:500 30px/1.1 "Bodoni Moda",serif;color:var(--or)}
.rules{width:100%;border-collapse:collapse;font-size:13.5px}
.rules th{text-align:left;color:var(--brume);font-weight:400;padding:6px 4px;border-bottom:1px solid var(--line)}
.rules td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.rules tr:last-child td{border-bottom:0}
.rules b{color:var(--or);font-weight:500}
details summary{cursor:pointer;font:italic 700 20px "Bodoni Moda",serif;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--or);font:300 24px "Jost"}
details[open] summary::after{content:"–"}
.modal{position:fixed;inset:0;background:rgba(10,4,16,.7);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:60;padding:20px}
.modal .box{max-width:380px;width:100%;background:#2A1434;border-color:rgba(233,191,98,.35)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:linear-gradient(135deg,#C8932F,#F6DC92 50%,#D9A84A);color:#2A1606;padding:10px 18px;border-radius:999px;font-weight:500;font-size:14px;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.toast.err{background:#C45B6B;color:#fff}
.welcome{padding-top:10px;text-align:center}
.welcome .box{text-align:left}
.link{color:var(--or);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.copyarea{width:100%;min-height:90px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ivoire);font:inherit;font-size:13px}
.qopt{display:block;width:100%;text-align:left;padding:15px 16px;margin:9px 0;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:16px;font-weight:400}
.qopt.on{border-color:var(--or);background:rgba(233,191,98,.14)}
.qopt.good{border-color:var(--ok);background:rgba(159,227,191,.08)} .qopt.bad{border-color:var(--bad);background:rgba(255,154,154,.07)}
.qnote{font:500 76px/1 "Bodoni Moda",serif;text-align:center}
.qnote small{font-size:28px;color:var(--brume)}
.how .step{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.how .step span{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 15px "Bodoni Moda",serif;color:#2A1606;background:linear-gradient(135deg,#C8932F,#F6DC92 50%,#D9A84A)}
.how .step b{font-weight:500}
.how .step div{font-size:14.5px;color:#E9DCEB}
.testcard{display:block;width:100%;text-align:center;padding:24px 18px;border-radius:20px;background:var(--card);border:1px solid rgba(233,191,98,.3);margin:12px 0}
.testcard b{display:block;font:italic 700 25px/1.2 "Bodoni Moda",serif;padding-top:3px}
.testcard span{display:block;font-size:14px;color:var(--brume);margin-top:6px}
.storyprev{width:100%;border-radius:12px;display:block;margin-bottom:10px}
/* écran de chargement */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 60% at 50% 30%,#4A2157 0%,#2A1434 45%,#1B0E22 85%);transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
#splash .tia{position:relative;width:min(62vw,280px)}
#splash .tia img{width:100%;display:block;filter:drop-shadow(0 0 24px rgba(246,218,142,.3));animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
#splash .tw{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;opacity:0;animation:tw 2.4s ease-in-out infinite}
#splash .tw::before,#splash .tw::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}
#splash .tw::before{width:2px;height:100%}#splash .tw::after{width:100%;height:2px}

const PERSO_BIAS=[-0.127,-0.08,0.022,0.063,-0.115,0.104,0.113,-0.132,-0.184,-0.061,0.052,0.037,-0.006,0.028,0.013,0.151,-0.15,-0.031,0.067,-0.106,0.208,0.154,0.07,0.148,0.023,0.09,0.051,-0.062,-0.235,0.046,-0.152];
const PERSO_IDF=(()=>{const f={};Object.values(PERSO).forEach(p=>p[0].forEach(t=>f[t]=(f[t]||0)+1));return t=>1/Math.sqrt(f[t]||1);})();
function persoResult(ans){
  const tags={}; ans.forEach((sel,i)=>{ if(sel==null) return; if(!Array.isArray(sel)) sel=[sel]; if(!sel.length) return; const w=1/sel.length;
    sel.forEach(o=>PERSO_Q[i][1][o][1].forEach(t=>tags[t]=(tags[t]||0)+w)); });
  let best=null;
  CANDS.forEach((c,k)=>{const tg=PERSO[c.id][0];const s=tg.reduce((a,t)=>a+(tags[t]||0)*PERSO_IDF(t),0)/Math.sqrt(tg.length)+PERSO_BIAS[k];
    if(!best||s>best.s) best={id:c.id,s,common:tg.filter(t=>tags[t])};});
  return best;
}

function makeApi(){
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  const rpc = async (f,a)=>{ const {data,error}=await sb.rpc(f,a); if(error) throw error; return data; };
  // Pas de compte : chaque téléphone garde une clé secrète, la base n'en garde qu'une empreinte
  const TK="lelue-tok", tok=()=>ls.get(TK);
  const key=()=>{ if(!tok()){ const a=new Uint8Array(32); crypto.getRandomValues(a); ls.set(TK,[...a].map(b=>b.toString(16).padStart(2,"0")).join("")); } return tok(); };
  let src="db", dbV=0, first=true;
  return {
    get stateSource(){ return src; },
    async myProfile(){ if(!tok()) return null; try{ return await rpc("my_profile",{p_tok:tok()}); }catch(e){ if(String(e.message).includes("NO_PROFILE")) return null; throw e; } },
    createProfile:(name,emoji)=>rpc("create_profile",{p_tok:key(),p_name:name,p_emoji:emoji}),
    saveProfile:(id,patch)=>rpc("save_profile",{p_tok:tok(),p:patch}),
    recoveryCode:()=>rpc("my_recovery_code",{p_tok:tok()}),
    recover:(code)=>rpc("recover_profile",{p_tok:key(),p_code:code}),
    createLeague:(name,crits)=>rpc("create_league",{p_tok:tok(),p_name:name,p_crits:crits}),
    setLeagueCrits:(id,crits)=>rpc("set_league_crits",{p_tok:tok(),p_league:id,p_crits:crits}),
    joinLeague:(code)=>rpc("join_league",{p_tok:tok(),p_code:code}),
    leaveLeague:(id)=>rpc("leave_league",{p_tok:tok(),p_league:id}),
    myLeagues:async()=>(await rpc("my_leagues",{p_tok:tok()}))||[],
    leagueProfiles:async(id)=>(await rpc("league_profiles",{p_tok:tok(),p_league:id}))||[],
    stats:()=>rpc("france_stats"),
    // L'état de la soirée : d'abord le petit fichier publié (gratuit, illimité), sinon la base
    // Au chargement on lit la base une fois ; ensuite le fichier, sauf s'il est plus ancien que la base
    async state(){
      if(first){ try{ const s=await rpc("public_state"); first=false; dbV=s.v||0; src="db"; return s; }catch(e){} }
      try{ const r=await fetch("/state.json",{cache:"no-cache"}); if(r.ok){ const j=await r.json(); if(j&&j.manche&&(j.v||0)>=dbV){ src="file"; dbV=j.v||dbV; return j; } } }catch(e){}
      return this.freshState();
    },
    async freshState(){ const s=await rpc("public_state"); dbV=Math.max(dbV,s.v||0); src="db"; return s; },
    async fileV(){ try{ const r=await fetch("/state.json",{cache:"no-store"}); if(r.ok){ const j=await r.json(); return j.v||0; } }catch(e){} return 0; },
    adminState:()=>rpc("public_state"),
    adminCheck:(pwd)=>rpc("admin_check",{p_pwd:pwd}),
    adminSetResults:(pwd,r)=>rpc("admin_set_results",{p_pwd:pwd,p_top15:r.top15,p_top5:r.top5,p_ord:r.ord}),
    adminSetState:(pwd,s)=>rpc("admin_set_state",{p_pwd:pwd,p_manche:s.manche,p_locked:s.locked,p_show_at:s.show_at,p_close_at:s.close_at}),
    adminReset:(pwd)=>rpc("admin_reset_night",{p_pwd:pwd}),
    // Classement de la France calculé par paquets ; publish=true le révèle à tout le monde
    async adminFrance(pwd,n,publish){
      let r=await rpc("admin_fr_step",{p_pwd:pwd,n,p_restart:true});
      while(!r.done) r=await rpc("admin_fr_step",{p_pwd:pwd,n,p_restart:false});
      return rpc("admin_fr_finish",{p_pwd:pwd,n,p_publish:publish});
    }
  };
}

const ALLC=CRITS.map(c=>c.id);
const critsOf=()=>CRITS;
function avg(p,cid,ids){const n=(p.notes||{})[cid];if(!n)return null;const v=(ids||ALLC).map(k=>n[k]).filter(x=>typeof x==="number");return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
const done=(p,cid,ids)=>{const n=(p.notes||{})[cid]||{};return (ids||ALLC).some(k=>typeof n[k]==="number");};
const notesOrder=p=>CANDS.map(c=>({c,s:avg(p,c.id)})).sort((a,b)=>(b.s??-1)-(a.s??-1)||a.c.n-b.c.n).map(x=>x.c.id);
const pool=n=>n===1?CANDS.map(c=>c.id):n===2?R.top15:R.top5;
const resultReady=n=>n===1?R.top15.length===15:n===2?R.top5.length===5:R.ord.every(Boolean);
function filterTo(order,ids){const s=new Set(ids);const out=order.filter(x=>s.has(x));ids.forEach(x=>{if(!out.includes(x))out.push(x);});return out;}
function roundOf(p,n){
  const r=(p.rounds||{})[n];
  if(Array.isArray(r)&&r.length) return filterTo(r,pool(n));
  if(n===1) return notesOrder(p);
  return filterTo(roundOf(p,n-1),pool(n));
}
const saved=(p,n)=>Array.isArray((p.rounds||{})[n]);
const inter=(a,b)=>a.filter(x=>b.includes(x)).length;
function pts(order,ref,n){
  if(n===1) return inter(order.slice(0,15),ref.slice(0,15));
  if(n===2) return 3*inter(order.slice(0,5),ref.slice(0,5));
  return (order[0]&&order[0]===ref[0]?10:0)+3*[1,2,3,4].filter(i=>order[i]&&order[i]===ref[i]).length;
}
const tvRef=n=>n===1?R.top15:n===2?R.top5:R.ord;
const frRef=n=>FR[n]&&!FR[n].hidden?filterTo(FR[n].order||[],pool(n)):null;
function scores(p){
  const out={tv:0,fr:0,by:{}};
  [1,2,3].forEach(n=>{
    const avail=n<R.manche||(n===R.manche&&R.votes_locked);
    if(n>R.manche) return;
    const ord=roundOf(p,n), b={tv:null,fr:null};
    if(resultReady(n)){b.tv=pts(ord,tvRef(n),n);out.tv+=b.tv;}
    const f=frRef(n); if(avail&&f&&f.length){b.fr=pts(ord,f,n);out.fr+=b.fr;}
    out.by[n]=b;
  });
  return out;
}

function placeBulbs(){
  document.querySelectorAll(".hero").forEach(f=>{const box=f.querySelector(".bulbs"); if(!box||box.childElementCount) return;
    const W=f.clientWidth,H=f.clientHeight,inset=12,R=W/2-inset,cx=W/2,cy=W/2,bottom=H-22;
    const arc=Math.PI*R,side=Math.max(0,bottom-cy),total=arc+2*side,N=Math.max(6,Math.round(total/52)),step=total/N;
    for(let i=0;i<=N;i++){let d=i*step,x,y;
      if(d<side){x=inset;y=bottom-d;} else if(d<side+arc){const a=Math.PI-(d-side)/R;x=cx+Math.cos(a)*R;y=cy-Math.sin(a)*R;} else {x=W-inset;y=cy+(d-side-arc);}
      const e=document.createElement("span");e.className="bulb";e.style.left=x+"px";e.style.top=y+"px";box.appendChild(e);
      if(BULBS_DONE) e.classList.add("lit"); else setTimeout(()=>e.classList.add("lit"),250+i*55);}
    setTimeout(()=>{BULBS_DONE=true;},300+N*55);
  });
}

function vHowTo(){

/* ===================== VUE QUIZ ===================== */
const QKEY="lelue-quiz";
const EXPRESS=(()=>{const per={};const out=[];QUIZ.forEach((q,i)=>{(per[q[0]]=per[q[0]]||[]).push(i);});
  const keys=Object.keys(per);let r=0;while(out.length<25){let added=false;keys.forEach(k=>{if(out.length<25&&per[k][r]!==undefined){out.push(per[k][r]);added=true;}});if(!added)break;r++;}
  return out;})();
const qList=q=>q&&q.mode==="express"?EXPRESS.map(i=>QUIZ[i]):QUIZ;
function qState(){ if(!UI.qz){ try{UI.qz=JSON.parse(ls.get(QKEY))||null;}catch(e){} if(!UI.qz) UI.qz={i:0,ans:[],started:false,done:false,review:false}; } return UI.qz; }
function qSave(){ ls.set(QKEY,JSON.stringify(UI.qz)); }
const qCorrect=(ans,L)=>(L||QUIZ).filter((q,i)=>ans[i]===q[3]).length;
const qNote=(c,n)=>Math.round(c/(n||QUIZ.length)*200)/10;
function vCulture(){
  const q=qState(); const L=qList(q);
  if(!q.started) {
    const prev=P.quiz_total?qNote(P.quiz_score,P.quiz_total):null;
    return `<button class="link" data-a="test" data-v="" style="margin-top:14px">← Retour</button><h2>Le test de culture G des Miss</h2>
    <div class="box"><p style="margin-bottom:10px">Les 31 candidates ont passé leur test de culture générale pendant leur voyage à Saint-Martin. <b>Et toi, tu aurais eu combien ?</b></p>

/* ===================== GLISSER-DÉPOSER ===================== */
let DRAG=null, pressTimer=null, pressStart=null;
document.addEventListener("touchmove",e=>{if(DRAG)e.preventDefault();},{passive:false});
document.addEventListener("contextmenu",e=>{if(DRAG||e.target.closest(".rank li"))e.preventDefault();});
document.addEventListener("pointerdown",e=>{
  const li=e.target.closest("#rank li[data-id]"); if(!li||e.target.closest("[data-a=moveto]")) return;
  if(e.target.closest(".handle")){e.preventDefault();startDrag(li,e);return;}
  pressStart={x:e.clientX,y:e.clientY,id:e.pointerId};
  clearTimeout(pressTimer); pressTimer=setTimeout(()=>{if(pressStart){navigator.vibrate&&navigator.vibrate(15);startDrag(li,{clientX:pressStart.x,clientY:pressStart.y,pointerId:pressStart.id});}},380);
});
document.addEventListener("pointermove",e=>{
  if(pressStart&&!DRAG&&Math.hypot(e.clientX-pressStart.x,e.clientY-pressStart.y)>8){clearTimeout(pressTimer);pressStart=null;}
  if(!DRAG) return; e.preventDefault(); DRAG.y=e.clientY; moveGhost();
});
document.addEventListener("pointerup",endPress); document.addEventListener("pointercancel",endPress);
function endPress(){clearTimeout(pressTimer);pressStart=null;if(DRAG)endDrag();}
function startDrag(li,e){
  const list=document.getElementById("rank"), r=li.getBoundingClientRect();
  const ph=document.createElement("li"); ph.className="ph"; ph.style.height=r.height+"px";
  li.parentNode.insertBefore(ph,li);
  li.classList.add("ghost"); li.style.width=r.width+"px"; li.style.left=r.left+"px"; li.style.top=r.top+"px";
  DRAG={li,ph,list,off:e.clientY-r.top,y:e.clientY}; document.body.classList.add("dragging");
  const loop=()=>{ if(!DRAG) return; const y=DRAG.y, H=window.innerHeight;
    if(y<110) window.scrollBy(0,-Math.ceil((110-y)/6)); else if(y>H-150) window.scrollBy(0,Math.ceil((y-(H-150))/6));
    moveGhost(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
function moveGhost(){
  const {li,ph,list,off,y}=DRAG; li.style.top=(y-off)+"px";
  const items=[...list.querySelectorAll("li[data-id]:not(.ghost)")];
  let before=null; for(const it of items){const r=it.getBoundingClientRect(); if(y<r.top+r.height/2){before=it;break;}}
  if(before){ if(ph.nextElementSibling!==before) list.insertBefore(ph,before.previousElementSibling&&before.previousElementSibling.classList.contains("cut")?before.previousElementSibling:before); }
  else if(list.lastElementChild!==ph) list.appendChild(ph);
}
function endDrag(){
  const {li,ph,list}=DRAG; list.insertBefore(li,ph); ph.remove();
  li.classList.remove("ghost"); li.style.cssText=""; DRAG=null; document.body.classList.remove("dragging");
  const order=[...list.querySelectorAll("li[data-id]")].map(x=>x.dataset.id), n=+list.dataset.n;
  if(order.join()!==roundOf(P,n).join()){ if(!isOpen()||n!==R.manche){toast(ERRORS.VOTES_LOCKED,true);render();return;} saveRound(n,order); }
  render();
}

/* Publication de l'état de la soirée dans le fichier state.json (servi gratuitement à tout le monde) */
const GH_URL="https://api.github.com/repos/cleeemmens/l-elue/contents/state.json";
let pubChain=Promise.resolve();
function publishState(){ pubChain=pubChain.then(doPublish,doPublish); return pubChain; }
async function doPublish(){
  const gh=ls.get("lelue-gh"); if(!gh){UI.pub="off";render();return;}
  UI.pub="busy"; render();
  try{
    const st=await API.adminState(); applyState(st);
    const H={Authorization:"Bearer "+gh,Accept:"application/vnd.github+json"};
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(st))));
    for(let tries=0;;tries++){
      let sha; const g=await fetch(GH_URL+"?ref=main",{headers:H,cache:"no-store"});
      if(g.ok) sha=(await g.json()).sha; else if(g.status!==404) throw new Error(g.status===401?"clé GitHub refusée ou expirée":"GitHub "+g.status);
      const p=await fetch(GH_URL,{method:"PUT",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({message:`Soirée : manche ${st.manche}${st.votes_locked?" fermée":" ouverte"}`,content,sha,branch:"main"})});
      if(p.ok) break;
      if((p.status===409||p.status===422)&&tries<2) continue;
      throw new Error(p.status===401||p.status===403?"clé GitHub refusée ou expirée":"GitHub "+p.status);
    }
    UI.pub="ok"; UI.pubAt=Date.now(); UI.pubErr="";
  }catch(e){ UI.pub="err"; UI.pubErr=e.message||String(e); }
  render();
}

    <form id="fgh" class="row" style="margin-top:10px"><input class="field grow" id="ghkey" placeholder="Colle ta clé GitHub (github_pat_…)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn sm gold">Enregistrer</button></form></div>`;
  const st=UI.pub==="busy"?`<span class="pill">publication…</span>`:UI.pub==="err"?`<span class="pill danger">échec</span>`:UI.pub==="ok"?`<span class="pill ok">publié à ${t}</span>`:`<span class="pill ok">prête</span>`;

}

(function(){const cv=document.getElementById("glitter");if(!cv)return;const g=cv.getContext("2d");const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;const P=[];
  for(let i=0;i<45;i++)P.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.6,v:.00008+Math.random()*.0002,ph:Math.random()*6.28,sp:.6+Math.random()*2,star:Math.random()<.2});

    g.clearRect(0,0,W,H);
    for(const q of P){if(!reduce){q.y+=q.v;if(q.y>1.02){q.y=-.02;q.x=Math.random();}}
      const a=Math.max(0,Math.sin(t/1000*q.sp+q.ph));const x=q.x*W,y=q.y*H,rr=q.r*dpr;
      g.globalAlpha=a*.75;g.fillStyle=a>.8?"#FFF6D8":"#F2CF7E";
      if(q.star&&a>.55){const L=rr*4*a;g.beginPath();g.moveTo(x-L,y);g.lineTo(x+L,y);g.moveTo(x,y-L);g.lineTo(x,y+L);g.strokeStyle=g.fillStyle;g.lineWidth=.8*dpr;g.stroke();}
      g.beginPath();g.arc(x,y,rr,0,6.283);g.fill();}
    g.globalAlpha=1;if(!document.hidden)requestAnimationFrame(draw);else setTimeout(()=>requestAnimationFrame(draw),500);}
  requestAnimationFrame(draw);})();
